name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # -PnextVersion keeps the version as is: CI must not bump it.
      - run: ./gradlew build -PnextVersion=$(grep '^version=' gradle.properties | cut -d= -f2)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FilteredHoppers
          path: |
            build/libs/*.jar
            build/reports/tests/
