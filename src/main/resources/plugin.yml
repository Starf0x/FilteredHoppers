name: FilteredHoppers
version: '${version}'
main: dev.hopperfilter.HopperFilterPlugin
api-version: '1.21'
description: Make every hopper a filter hopper with allow and block modes
author: Starf0x
commands:
  hopperfilter:
    description: Reload the filter hopper config
    usage: /hopperfilter reload
    aliases: [hfilter]
    permission: hopperfilter.reload
permissions:
  hopperfilter.use:
    description: May open the filter menu of hoppers and hopper minecarts
    default: true
  hopperfilter.reload:
    description: May reload the hopper filter config
    default: op