# Configuration for PaperFilteredHoppers
#
# Every hopper can be filtered. No tool is needed:
#   shift-right-click a hopper  -> open the filter menu
#
# The filter menu always has 9 slots:
#   slot 0  = green emerald (allow mode) / black blackstone (block mode)
#             Click slot 0 to switch; the items in slots 1-8 belong
#             to the displayed mode. Both lists stay on the hopper at the same time.
#   slot 1-8 = the filter items of the displayed mode. Click the item you
#              want to filter from your own inventory into a slot.

gui-title: "&0Hopper Filter"

# Whether the filter matches only the item type (true), or also
# name/lore/enchantments (false = exact item comparison)?
match-by-type: true

# Visual hint: give filter hoppers (with an active filter) a red rim.
visual-enabled: true